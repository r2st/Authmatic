[project]
name = "authmatic-agent"
version = "0.1.0"
description = "The 4-verb ReAct loop agent service for Authmatic."
requires-python = ">=3.12"

[project.optional-dependencies]
# Test deps (ticket 0010). Install: `pip install -e '.[dev]'` or
# `pip install pytest pytest-asyncio httpx`.
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<0.25",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # pytest assertions

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
