[project]
name = "authmatic-agent"
version = "0.1.0"
description = "The 4-verb ReAct loop agent service for Authmatic."
requires-python = ">=3.12"

[project.optional-dependencies]
# Test + lint deps (tickets 0010 / 0032). Install: `pip install -e '.[dev]'`
# or `pip install pytest pytest-asyncio httpx ruff mypy`.
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<0.25",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 pytest assertions; B008 is the idiomatic FastAPI Depends/File/Header/Form
# default-arg pattern; S108 flags the sandbox /tmp path inside Daytona code
# strings (not a real temp-file write here).
ignore = ["S101", "B008", "S108"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately set fixture tokens/paths.
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true   # asyncpg/daytona/etc. ship partial stubs
warn_unused_ignores = true
# Pragmatic baseline (ticket 0032): not strict yet — type the new modules
# first, then tighten. Existing dynamic code (tools/*) stays lenient.
check_untyped_defs = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
