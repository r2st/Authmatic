name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm --filter web typecheck
        working-directory: .
      - name: Lint
        run: pnpm --filter web lint
        working-directory: .
      - name: Build
        run: pnpm --filter web build
        working-directory: .

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt && pip install ruff mypy pytest pytest-asyncio
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy . || true   # TODO: drop `|| true` once 0010 lands type coverage
      - name: Pytest
        run: pytest -q || true # TODO: drop `|| true` once 0010 lands tests

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
