name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter authmatic-web typecheck
      - name: Lint
        run: pnpm --filter authmatic-web lint
      - name: Test
        run: pnpm --filter authmatic-web test
      - name: Build
        run: pnpm --filter authmatic-web build
      - name: Dependency audit (non-blocking)
        run: pnpm audit --prod || true

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy (baseline — typed modules)
        run: mypy src || true   # lenient baseline (ticket 0032); tighten incrementally
      - name: Pytest
        run: pytest -q
      - name: Dependency audit (non-blocking)
        run: pip install pip-audit && pip-audit || true

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint migrations
        run: bash scripts/lint-migrations.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
